services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://nova:nova@db:5432/nova
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=nova
      - POSTGRES_PASSWORD=nova
      - POSTGRES_DB=nova
    # Port non exposé (accès interne Docker uniquement, évite les conflits locaux)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://nova:nova@db:5432/nova
      - CHECK_MODE=fixture
      - FIXTURE_NAME=in_stock.html
    depends_on:
      - db
      - api  # L'API exécute migrations/seed au démarrage (start.sh), le worker en dépend
    restart: "no"

volumes:
  postgres_data:
